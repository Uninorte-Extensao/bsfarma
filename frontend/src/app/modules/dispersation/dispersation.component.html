<div>
    <header>
        <small class="px-5 text-obs">Novo Atendimento.</small>
    </header>

    <div class="px-5 pt-3" [formGroup]="form">
        <div class="flex flex-column gap-3">
            <div class="flex flex-column gap-2">
                <label for="nome">ID interno do Paciente</label>
                <p-autocomplete 
                formControlName="paciente_id" 
                [suggestions]="filteredPatient()" 
                (completeMethod)="filterPatient($event)" 
                optionLabel="id_interno"
                optionValue="id" 
                fluid
                />
            </div>
    
            <div class="flex w-full gap-3 align-items-end">
                <div class="flex flex-column gap-2 w-full">
                    <label for="medicine">Medicamentos</label>
                    <p-select
                    id="medicine"
                    [options]="loteComputed()"
                    optionLabel="nomeGenerico"
                    optionId="id"
                    fluid
                    #select
                    >
                    </p-select>
                </div>
    
                <p-button label="Adicionar" (click)="addLote(select.value)"/>
            </div>

            @if(batchSelected().length) {
                @for (item of batchSelected(); track $index) {
                    <div class="bg-color">
                        <div class="flex justify-content-between">
                            <div class="flex flex-column gap-1">
                                <span>
                                    {{item.nomeGenerico}}
                                </span>
                                <small>
                                    {{item.concentracao}} - {{item.viaAdministracao}}  {{item.numero_lote}}
                                </small>
                            </div>

                            <div>
                                <p-inputnumber 
                                    [(ngModel)]="value"
                                    [showButtons]="true"
                                    buttonLayout="horizontal"
                                    spinnerMode="horizontal"
                                    inputId="horizontal"
                                    [ngModelOptions]="{ standalone: true }"
                                >

                                    <ng-template #incrementbuttonicon>
                                        <span class="pi pi-plus"></span>
                                    </ng-template>

                                    <ng-template #decrementbuttonicon>
                                        <span class="pi pi-minus"></span>
                                    </ng-template>

                                </p-inputnumber>
                            </div>
                        </div>
                    </div>
                }
            }
        </div>
    </div>

</div>
