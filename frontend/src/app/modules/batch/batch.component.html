<section>
    <header>
        <small class="px-5 text-obs">Lista de Lotes</small>
    </header>

    <aside class="px-5 pt-3 relative">
        <p-table 
        [value]="listLote()"
        [paginator]="true"
        [rows]="8"
        [rowsPerPageOptions]="[8, 16, 32]"
        dataKey="id"
        [globalFilterFields]="[
            'numero_lote',
            'fabricante',
            'validade',
            'quantidade_inicial',
            'quantidade_atual'
        ]"
        #dt
        >

            <ng-template #caption>
                <div class="flex">
                    <p-iconfield iconPosition="left" class="ml-auto">
                        <p-inputicon>
                            <i class="pi pi-search"></i>
                        </p-inputicon>

                        <input 
                            pInputText 
                            type="text" 
                            (input)="dt.filterGlobal($event.target.value, 'contains')" 
                            placeholder="Buscar lote" 
                        />
                    </p-iconfield>
                </div>
            </ng-template>

            <ng-template #header>
                <tr>

                    <th pSortableColumn="numero_lote">
                        <div class="flex items-center gap-2">
                            Nº Lote
                            <p-sortIcon field="numero_lote" />
                        </div>
                    </th>

                    <th pSortableColumn="fabricante">
                        <div class="flex items-center gap-2">
                            Fabricante
                            <p-sortIcon field="fabricante" />
                        </div>
                    </th>

                    <th pSortableColumn="validade">
                        <div class="flex items-center gap-2">
                            Validade
                            <p-sortIcon field="validade" />
                        </div>
                    </th>

                    <th pSortableColumn="quantidade_inicial">
                        <div class="flex items-center gap-2">
                            Qtd Inicial
                            <p-sortIcon field="quantidade_inicial" />
                        </div>
                    </th>

                    <th pSortableColumn="quantidade_atual">
                        <div class="flex items-center gap-2">
                            Qtd Atual
                            <p-sortIcon field="quantidade_atual" />
                        </div>
                    </th>

                    <th pSortableColumn="entrada_em">
                        <div class="flex items-center gap-2">
                            Entrada em
                            <p-sortIcon field="entrada_em" />
                        </div>
                    </th>

                    <th>
                        <div class="flex items-center gap-2">
                            Ação
                        </div>
                    </th>

                </tr>
            </ng-template>

            <ng-template #body let-item>
                <tr>

                    <td>
                        {{ item.numero_lote }}
                    </td>

                    <td>
                        {{ item.fabricante }}
                    </td>

                    <td>
                        {{ item.validade | date:'dd/MM/yyyy' }}
                    </td>

                    <td>
                        {{ item.quantidade_inicial }}
                    </td>

                    <td>
                        {{ item.quantidade_atual }}
                    </td>

                    <td>
                        {{ item.entrada_em | date:'dd/MM/yyyy HH:mm' }}
                    </td>

                    <td>
                    <div class="flex gap-1">
                        <p-button
                        icon="pi pi-pencil"
                        rounded 
                        text
                        severity="warn"
                        (click)="goToEdit(item)"
                        />
                    </div>
                    </td>

                </tr>
            </ng-template>

        </p-table>

        <div class="btn-add">
            <p-button 
            label="Adicionar lote" 
            icon="pi pi-plus"
            (click)="goToCreate()"
            />
        </div>
    </aside>
</section>
