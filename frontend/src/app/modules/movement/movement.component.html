<section>
    <header>
        <small class="px-5 text-obs">Novo Atendimento.</small>
    </header>
    <aside class="px-5 pt-3">
        <div class="grid">
            @for(item of cardItems(); track $index) {
                <app-card-view
                    class="col-12 md:col-3"
                    [title]="item.title"
                    [value]="item.value"
                    [subtitle]="item.subtitle"
                    [icon]="item.icon"
                    [variant]="item.variant"
                />
            }
        </div>
    </aside>

    <aside class="px-4 pt-3">
   <p-table 
        [value]="listMovements()"
        [paginator]="true"
        [rows]="5"
        [rowsPerPageOptions]="[5, 10, 15]"
        dataKey="id"
        [globalFilterFields]="[
            'tipo',
            'quantidade',
            'justificativa',
            'usuario_id',
            'lote_id'
        ]"
        #dt
    >

        <ng-template #caption>
            <div class="grid align-items-end w-full justify-content-between">

                <div class="col-12 md:col-3">
                    <p-iconfield iconPosition="left" class="w-full">
                        <p-inputicon>
                            <i class="pi pi-search"></i>
                        </p-inputicon>

                        <input 
                            pInputText 
                            fluid
                            type="text"
                            class="w-full"
                            (input)="dt.filterGlobal($event.target.value, 'contains')" 
                            placeholder="Buscar movimentação" 
                        />
                    </p-iconfield>
                </div>

                <div class="col-12 md:col-3">
                    <p-select
                        [options]="lotes()"
                        optionLabel="numero_lote"
                        optionValue="id"
                        fluid
                        filter
                        placeholder="Filtrar por lote"
                        [(ngModel)]="loteId"
                        (onChange)="onChangeLote($event.value)"
                        showClear
                    >
                    </p-select>
                </div>

                <div class="col-12 md:col-3">
                    <p-button 
                        label="Adicionar movimentação" 
                        icon="pi pi-plus"
                        (click)="goToCreate()"
                        fluid
                    />
                </div>

            </div>
        </ng-template>

        <ng-template #header>
            <tr>

                <th pSortableColumn="tipo">
                    <div class="flex items-center gap-2">
                        Tipo
                        <p-sortIcon field="tipo" />
                    </div>
                </th>

                <th pSortableColumn="quantidade">
                    <div class="flex items-center gap-2">
                        Quantidade
                        <p-sortIcon field="quantidade" />
                    </div>
                </th>

                <th pSortableColumn="justificativa">
                    <div class="flex items-center gap-2">
                        Justificativa
                        <p-sortIcon field="justificativa" />
                    </div>
                </th>

                <th pSortableColumn="usuario_id">
                    <div class="flex items-center gap-2">
                        Usuário
                        <p-sortIcon field="usuario_id" />
                    </div>
                </th>

                <th pSortableColumn="ocorrido_em">
                    <div class="flex items-center gap-2">
                        Ocorrido em
                        <p-sortIcon field="ocorrido_em" />
                    </div>
                </th>

                <th>
                    <div class="flex items-center gap-2">
                        Ação
                    </div>
                </th>

            </tr>
        </ng-template>

        <ng-template #body let-item>
            <tr>

                <td>
                    <span
                        class="px-2 py-1 border-round text-sm font-semibold"
                        [class]="item.tipo === 'entrada'
                            ? 'bg-green-100 text-green-700'
                            : 'bg-red-100 text-red-700'"
                    >
                        {{ item.tipo }}
                    </span>
                </td>

                <td>
                    {{ item.quantidade }}
                </td>

                <td>
                    {{ item.justificativa }}
                </td>

                <td>
                    {{ item.usuario_id }}
                </td>

                <td>
                    {{ item.ocorrido_em | date:'dd/MM/yyyy HH:mm' }}
                </td>

                <td>
                    <div class="flex gap-1">
                        <p-button
                            icon="pi pi-pencil"
                            rounded 
                            text
                            severity="warn"
                            (click)="goToEdit(item)"
                        />
                    </div>
                </td>

            </tr>
        </ng-template>

    </p-table>
    </aside>
</section>
