<div class="auth-layout">
    <div class="auth-bg" aria-hidden="true">
        <span class="blob blob-blue"></span>
        <span class="blob blob-yellow"></span>
        <span class="blob blob-red"></span>
    </div>

    <div class="brand-panel">
        <img class="brand-logo" src="assets/logo_bsfarma.svg" alt="BS Farma">

        <p class="brand-desc">
            Sistema de gestão de insumos farmacêuticos.
        </p>

        <span class="brand-version">v1.0</span>
    </div>

    <div class="form-panel">
        <div class="content">
            <div class="content-header">
                <h3 class="content-title">Bem-vindo de volta!</h3>
                <p class="content-subtitle">Acesse com seu login e senha.</p>
            </div>

            <app-login (onChangeLogin)="submit($event)" />
        </div>
    </div>
</div>
