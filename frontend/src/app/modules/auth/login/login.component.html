<form [formGroup]="form" (ngSubmit)="saveData()">
    <div class="flex flex-column gap-3 p-4">
        <div class="my-4 flex flex flex-column gap-2">
            <div class="flex flex-column gap-1">
                <label for="login">Login*</label>
                <input pInputText id="login" fluid formControlName="username"/>
            </div>
            
            <div class="flex flex-column gap-1">
                <label for="password">Senha*</label>
                <p-password [toggleMask]="true" fluid id="password" formControlName="password"/>
            </div>
        </div>
        <div class="flex justify-content-center">
            <p-button 
            [disabled]="form.invalid" 
            label="Entrar" 
            [outlined]="true" 
            iconPos="right" 
            icon="pi pi-sign-in" 
            type="submit"
            />
        </div>
    </div>
</form>
