<section>
    <header>
        <small class="px-5 text-obs">Lista de Lotes</small>
    </header>

    <aside class="px-5 pt-3">
        <div class="grid">
            @for(item of cards(); track $index) {
                <div class="col-12 md:col-4">
                    <div class="card" [class]="item.color">
                        <div class="box-icon">
                            <i [class]="item.icon"></i>
                        </div>
                        <div class="flex flex-column gap-1">
                            <div>{{item.label}}</div>
                            <h2 class="label m-0">{{item.valor}}</h2>
                        </div>
                    </div>
                </div>
            }
        </div>

        <div>
            <p-tabs value="0">
                <p-tablist>
                    <p-tab value="0">Abertos</p-tab>
                    <p-tab value="1">Resolvidos</p-tab>
                    <p-tab value="2">Todos</p-tab>
                </p-tablist>
                <p-tabpanels>
                    <p-tabpanel value="0">
                        <div class="container-alert">
                            @for(item of listAlerts(); track $index) {
                                <app-table-alerts [item]="item"/>
                            }
                        </div>
                    </p-tabpanel>
                    <p-tabpanel value="1">

                    </p-tabpanel>
                    <p-tabpanel value="2">

                    </p-tabpanel>
                </p-tabpanels>
            </p-tabs>
        </div>

        
    </aside>
</section>
