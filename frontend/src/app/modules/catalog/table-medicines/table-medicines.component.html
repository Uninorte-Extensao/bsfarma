<div class="list-toolbar">
    <div class="list-toolbar-filters">
        <p-iconfield iconPosition="left">
            <p-inputicon>
                <i class="pi pi-search"></i>
            </p-inputicon>
            <input pInputText type="text" (input)="onSearch($event.target.value)" placeholder="Buscar" />
        </p-iconfield>

        <p-select
            class="status-filter"
            [options]="filterOptions"
            optionLabel="label"
            optionValue="value"
            [ngModel]="statusFilter()"
            (ngModelChange)="onStatusChange($event)"
            placeholder="Status"
        />
    </div>

    @if (authService.hasPermission('catalog.create')) {
        <p-button
            [label]="isMobile() ? 'Adicionar' : 'Adicionar Medicamento'"
            icon="pi pi-plus"
            (click)="goToCreate()"
        />
    }
</div>

<div class="cards-grid">
    @for (item of pagedList(); track item.id) {
        <div class="card entity-card">

            <div class="entity-card-header">
                <div class="entity-avatar">
                    <i class="pi pi-box"></i>
                </div>

                <div class="entity-info">
                    <div class="entity-title">{{ item.nome_generico }}</div>
                    <small class="entity-subtitle">{{ item.nome_comercial }}</small>
                </div>

                <div class="entity-actions">
                    <p-button icon="pi pi-pencil" rounded text severity="warn" (click)="goToEdit(item)" />
                    <p-button icon="pi pi-trash" rounded text severity="danger" (click)="deleteItem(item)" />
                </div>
            </div>

            <div class="entity-tags">
                <p-tag [value]="item.concentracao" severity="secondary" />
                <p-tag [value]="item.ativo ? 'Ativo' : 'Inativo'" [severity]="item.ativo ? 'success' : 'danger'" />
            </div>

            @if (!isMobile()) {
                <div class="entity-meta">
                    <small>{{ item.forma_farmaceutica }}</small>
                    <small>Via {{ item.via_administracao }}</small>
                </div>
            }

        </div>
    } @empty {
        <div class="empty-state">Nenhum medicamento encontrado.</div>
    }
</div>

<p-paginator
    [first]="first()"
    [rows]="rows()"
    [totalRecords]="filteredList().length"
    [rowsPerPageOptions]="[12, 24, 36]"
    (onPageChange)="onPageChange($event)"
/>
