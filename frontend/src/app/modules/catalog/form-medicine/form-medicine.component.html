<section>
    <aside class="m-0 grid">
        <div class="col-12 md:col-6">
            <div class="flex flex-column gap-2">
                <label for="nomeG">Nome Genérico</label>
                <input 
                pInputText 
                id="nomeG" 
                placeholder="Ex: Dipirona Sódica" />
            </div>
        </div>

        <div class="col-12 md:col-6">
            <div class="flex flex-column gap-2">
                <label for="nomeC">Nome Comercial</label>
                <input 
                pInputText 
                id="nomeC" 
                placeholder="Ex: Novalgina" />
            </div>
        </div>

        <div class="col-12 md:col-6">
            <div class="flex flex-column gap-2">
                <label for="forma">Forma Farmacêutica</label>
                <p-select 
                id="forma" 
                [options]="listFormaFarm()" 
                optionLabel="label" 
                optionValue="value" 
                placeholder="Ex: Comprimido" />
            </div>
        </div>

        <div class="col-12 md:col-6">
            <div class="flex gap-2 align-items-end">
                <div class="flex flex-column gap-2 w-7">
                    <label for="concentracao">Concentração</label>
                    <p-inputnumber 
                    inputId="concentracao" 
                    placeholder="Ex: 500" 
                    fluid />
                </div>


                <p-select
                    id="concentracaoUnidade"
                    [options]="listConcentracao()"
                    optionLabel="label"
                    optionValue="value"
                    fluid
                    appendTo="body"
                    placeholder="Ex: mg"
                    class="w-5">
                </p-select>
            </div>
        </div>

        <div class="col-12 md:col-6">
            <div class="flex flex-column gap-2">
                <label for="via">Via de administração</label>
                <p-select 
                id="via" 
                [options]="listViaAdm()" 
                optionLabel="label" 
                optionValue="value" 
                placeholder="Ex: Oral"
                appendTo="body" />
            </div>
        </div>

        <div class="col-12 md:col-6">
            <div class="flex flex-column gap-2">
                <label for="estoqueMinimo">Estoque Mínimo</label>
                <p-inputnumber 
                inputId="estoqueMinimo" 
                placeholder="Ex: 100" 
                fluid 
                appendTo="body" />
            </div>
        </div>
