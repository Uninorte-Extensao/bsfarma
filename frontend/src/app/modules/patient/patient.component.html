<div>
    <header>
        <small class="px-5 text-obs">Lista de pacientes.</small>
    </header>

    <div class="card relative">
        <p-tabs value="0">

            <p-tablist>
                <p-tab value="0">Todos</p-tab>
                <p-tab value="1">Ativos</p-tab>
                <p-tab value="2">Inativos</p-tab>
            </p-tablist>

            <p-tabpanels>

                <p-tabpanel value="0">
                    <app-table-patient
                        [listPacientes]="pacientes()"
                        (onItemDelete)="delete($event)"
                        [(isVisible)]="isVisible"
                        [(codigo)]="codigo"
                    />
                </p-tabpanel>

                <p-tabpanel value="1">
                    <app-table-patient
                        [listPacientes]="pacientesAtivos()"
                    />
                </p-tabpanel>

                <p-tabpanel value="2">
                    <app-table-patient
                        [listPacientes]="pacientesInativos()"
                    />
                </p-tabpanel>

            </p-tabpanels>

        </p-tabs>

        <div class="btn-add flex gap-2">
            <p-button
                [label]="isMobile() ? '':'Adicionar Paciente'"
                icon="pi pi-plus"
                (click)="showModal('criar')"
            />

            <p-button
            [label]="isMobile()?'':'Recuperar Paciente'"
            icon="pi pi-sync"
            (click)="showModal('recuperar')"
            />
        </div>

    </div>
</div>

<p-dialog
[(visible)]="isVisible"
[header]="
typeDialog() === 'criar' ? 'Adicionar Paciente' : 
typeDialog() === 'recuperar' ? 'Recuperar Paciente' :
'Editar Paciente'
"
(onHide)="closeModal()"
[draggable]="false"
[resizable]="false"
[style]="{width: '25rem'}"
[modal]="true"
>

@if(isVisible()) {
    <form class="my-2 flex flex-column gap-3" (ngSubmit)="submit()">
        @if(typeDialog() === 'criar' || typeDialog() === 'recuperar') {
            <div class="flex flex-column gap-2">
                <label for="cpf">CPF</label>
                <p-inputmask
                id="cpf" 
                fluid 
                placeholder="000.000.000-00"
                mask="999.999.999-99"
                [(ngModel)]="cpf"
                [ngModelOptions]=" {standalone : true }"
                ></p-inputmask>
            </div>
        }

        @if(typeDialog() === 'criar' || typeDialog() === 'editar') {
            <div class="flex flex-column gap-2">
                <label for="condicao">
                    Condição clínica
                </label>
    
                <textarea
                pInputTextarea
                rows="4"
                placeholder="Descreva a condição clínica"
                fluid
                id="condicao"
                [(ngModel)]="condicaoClinica"
                [ngModelOptions]="{standalone:true}"
                >
                </textarea>
            </div>
        }
        
        <div class="flex gap-2 justify-content-end">
            <p-button label="Cancelar" severity="danger" (click)="closeModal()"/>
            <p-button label="Salvar" severity="success" type="submit"/>
        </div>
    </form>
}

</p-dialog>
