<div class="container">
    <app-breadcrumb />

    <div class="actions">
        <button
            type="button"
            class="icon-btn"
            [title]="themeService.isDark() ? 'Modo claro' : 'Modo escuro'"
            (click)="toggleTheme()">
            <i class="pi" [class.pi-sun]="themeService.isDark()" [class.pi-moon]="!themeService.isDark()"></i>
        </button>

        <button type="button" class="icon-btn" routerLink="/alerts" title="Notificações">
            <i class="pi pi-bell"></i>
            @if(qtd() > 0) {
                <span class="dot"></span>
            }
        </button>

        <div class="divider"></div>

        <div class="profile cursor-pointer" (click)="menu.toggle($event)">
            <div class="box-icon" [ngClass]="getProfileClass(user()?.perfil)">
                @if(user()?.nome) {
                    <span>{{ inititalName(user()!.nome) | uppercase }}</span>
                }
            </div>

            <div class="profile-info">
                <span class="name">{{ user()?.nome }}</span>
                <small class="role">{{ user()?.perfil | titlecase }}</small>
            </div>
        </div>

        <p-menu #menu [model]="itemsProfile" [popup]="true" appendTo="body" />
    </div>
</div>
