name: CI

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.5.1"
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend - testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-dummy-secret
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instalar dependências
        run: poetry install --no-root --no-interaction

      - name: Testes
        run: poetry run pytest -q

  backend-migrations:
    name: Backend - migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-dummy-secret
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instalar dependências
        run: poetry install --no-root --no-interaction --only main

      - name: Aplicar migrations
        run: poetry run alembic upgrade head

      - name: Verificar models x migrations
        run: poetry run alembic check

      - name: Reverter migrations
        run: poetry run alembic downgrade base

      - name: Reaplicar migrations
        run: poetry run alembic upgrade head

  frontend-build:
    name: Frontend - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build
