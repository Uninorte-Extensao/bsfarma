[tool.poetry]
name = "bs-farma"
version = "0.1.0"
description = "Sistema de controle de estoque farmacêutico — UBS Saúde Sempre"
authors = ["Time RemédioEmDia"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# --- framework ---
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }

# --- banco de dados ---
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
asyncpg = "^0.29.0"          # driver async para PostgreSQL / Supabase
alembic = "^1.13.0"

# --- validação e configuração ---
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"

# --- autenticação ---
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }

# --- agendamento de alertas ---
apscheduler = "^3.10.4"

# --- relatórios ---
pandas = "^2.2.0"
openpyxl = "^3.1.0"
bcrypt = "4.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
freezegun = "^1.5.0"
pytest-cov = "^5.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
