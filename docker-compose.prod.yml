# ---------------------------------------------------------------------------
# Ambiente de PRODUÇÃO.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
#   Aplicação .... http://localhost  (porta 80, servida pelo Nginx)
#
# Diferenças em relação ao ambiente de desenvolvimento:
#   - O frontend é compilado (`ng build --configuration production`) e servido
#     como arquivos estáticos pelo Nginx — não há `ng serve` nem hot-reload.
#   - O Nginx faz proxy de /api/ para a API, então o navegador enxerga tudo na
#     mesma origem e não há CORS envolvido.
#   - A API não expõe porta para o host: só o Nginx fala com ela, pela rede
#     interna do Compose.
#   - Não há serviço de banco: em produção o PostgreSQL é o Supabase, definido
#     pelo DATABASE_URL em backend/.env.
# ---------------------------------------------------------------------------

services:
  api:
    build:
      context: ./backend       # INSTALL_DEV=false (padrão): imagem sem pytest
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
      target: production
    ports:
      # Porta do host configurável: útil se a 80 já estiver ocupada ou se a
      # aplicação for rodar atrás de outro proxy/balanceador.
      #   WEB_PORT=8080 docker compose -f docker-compose.prod.yml up -d
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
