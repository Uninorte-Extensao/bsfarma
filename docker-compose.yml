# ---------------------------------------------------------------------------
# Ambiente de DESENVOLVIMENTO — sobe a stack inteira com hot-reload.
#
#   docker compose up --build
#
#   Frontend (ng serve) ...... http://localhost:4200
#   API (uvicorn --reload) ... http://localhost:8000  (docs em /docs)
#   PostgreSQL ............... localhost:5432
#
# Para produção, use o docker-compose.prod.yml.
# ---------------------------------------------------------------------------

services:
  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"        # inclui pytest e demais dependências de dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Sobrescreve o DATABASE_URL do .env para apontar ao Postgres local
      # deste compose, em vez do Supabase. Comente esta linha se quiser
      # desenvolver conectado ao Supabase.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/postgres
    volumes:
      - ./backend/app:/app/app       # hot-reload do código da API
      - ./backend/tests:/app/tests   # tests/ fica fora da imagem (.dockerignore);
                                     # montar aqui permite `docker compose exec api pytest`
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
